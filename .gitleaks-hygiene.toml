title = "smarrtbot public-repo hygiene (no default rules: their global allowlist hides these)"

# Public-repo hygiene: no private LAN addresses or personal home paths.
[[rules]]
id = "private-ipv4"
description = "Private IPv4 address (use a placeholder such as arr-host)"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "172.", "192.168."]

[[rules]]
id = "home-path"
description = "Personal home directory path (use a placeholder such as /srv/media)"
regex = '''/home/[A-Za-z0-9._-]+/'''
keywords = ["/home/"]

[allowlist]
description = "The rule files themselves and obvious placeholders"
paths = ['''\.gitleaks(-hygiene)?\.toml$''']
regexes = ['''(?i)(placeholder|example)''']
